name: Build and test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fyne's OpenGL and windowing bindings need these headers on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - uses: extractions/setup-just@v3

      # Runs the unit tests, go vet, golangci-lint and the gofmt check.
      - name: Test
        run: just test

      - name: Build
        run: go build -o sofar-sogood-ci .
